/*
 * Vision Pipeline Request Contract
 *
 * This file only keeps what is required to request a vision pipeline run.
 *
 * Required inputs:
 * - id: unique id generated by the caller for idempotency/tracing.
 * - use_cases: ordered list of business intents.
 *   One request can trigger multiple pipeline steps.
 * - source_event_id/category/sub: correlation with the primary trigger event.
 * - source_event: the actual Event that triggered the workflow (as Any for type flexibility).
 * - media_events: uploaded media payload(s) linked to the source event.
 * - context: business scoping info (device, teams, candidate drivers).
 * - tags: free key/value metadata for routing and observability.
 *
 * Output:
 * - PipelineExecutionResponse carries the produced vision event(s).
 * - correlation_id in response must be the same value as request.id.
 * - status/error/use_case_results provide execution diagnostics.
 */
syntax = "proto3";

package domain.pipeline.v1;

import "buf/validate/validate.proto";
import "domain/v1/events/event.proto";
import "domain/v1/events/media_event.proto";
import "domain/v1/events/vision_event.proto";
import "domain/v1/orders/device.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/v3-tecnologia/protocol-cloud/proto/gen/domain/v1/pipeline;pipeline";
option java_multiple_files = true;
option java_outer_classname = "PipelineProto";
option java_package = "br.com.v3.protocol.domain.pipeline";
option optimize_for = CODE_SIZE;

enum UseCase {
  USE_CASE_UNSPECIFIED = 0;
  USE_CASE_GENERIC = 1;
  USE_CASE_FACE_MATCH = 2;
  USE_CASE_PEOPLE_COUNT = 3;
  USE_CASE_OBJECT_DETECTION = 4;
  USE_CASE_PLATE_READING = 5;
  USE_CASE_SEATBELT_DETECTION = 6;
}

enum ExecutionStatus {
  EXECUTION_STATUS_UNSPECIFIED = 0;
  EXECUTION_STATUS_SUCCESS = 1;
  EXECUTION_STATUS_PARTIAL = 2;
  EXECUTION_STATUS_FAILED = 3;
}

// Business identifiers that scope pipeline processing in our domain.
message BusinessContext {
  // Device context from domain contract (includes id, uid, account_id).
  domain.orders.v1.Device device = 1;

  // Teams used to scope face/driver matching in business rules.
  repeated string team_ids = 2 [(buf.validate.field).string.min_len = 1];

  // Optional set of expected/candidate drivers for narrowed matching.
  repeated string candidate_driver_ids = 3 [(buf.validate.field).string.min_len = 1];

  // Extra domain metadata that may be useful for rules.
  map<string, string> attributes = 4;
}

// Input payload consumed by the vision pipeline runtime.
// Keeps dataset configuration separated from execution-time event/media data.
message PipelineExecutionRequest {
  // Unique request id generated by the caller.
  string id = 9 [(buf.validate.field).string.min_len = 1];

  // Ordered use cases requested by the client.
  // The processing service can map this list into N execution steps.
  repeated UseCase use_cases = 1;

  // Original event identifier that triggered the media upload.
  string source_event_id = 2 [(buf.validate.field).string.min_len = 1];

  // Original source event category for deterministic correlation.
  domain.events.v1.EventCategory source_event_category = 3;

  // Original source event subcategory for deterministic correlation.
  domain.events.v1.EventSub source_event_sub = 4;

  // Media upload events linked to the source event.
  repeated domain.events.v1.Media media_events = 5;

  // Media uploaded notifications linked to the source event.
  // Preferred contract for finalized media inputs.
  repeated domain.events.v1.MediaUploadedEvent media_uploaded_events = 10;

  // The actual Event message that triggered the workflow.
  domain.events.v1.Event source_event = 6;

  // Business context required to evaluate domain-level constraints.
  BusinessContext context = 7;

  // Generic execution metadata (tenant, trace_id, etc.).
  map<string, string> tags = 8;

  google.protobuf.Timestamp received_at = 100;
}

message PipelineExecutionResponse {
  // Unique response id generated by the processing service.
  string id = 4 [(buf.validate.field).string.min_len = 1];

  // Correlation id referencing PipelineExecutionRequest.id.
  string correlation_id = 5 [(buf.validate.field).string.min_len = 1];

  // Correlation with the original trigger event.
  string source_event_id = 1;

  // Use cases actually executed for this request.
  repeated UseCase executed_use_cases = 2;

  // Use cases that failed during execution.
  repeated UseCase failed_use_cases = 10;

  // Overall execution status.
  ExecutionStatus status = 6;

  // Optional domain-friendly error code for failed/partial executions.
  string error_code = 7;

  // Optional error details for observability/troubleshooting.
  string error_message = 8;

  // Per-use-case structured outputs (key: enum name, value: result payload).
  map<string, google.protobuf.Struct> use_case_results = 9;

  // Produced vision events.
  repeated domain.events.v1.Vision vision_events = 3;

  google.protobuf.Timestamp processed_at = 100;
}