syntax = "proto3";

option java_multiple_files = true;
option java_package = "br.com.v3.protocol.domain.adas";
option java_outer_classname = "ADASEventProto";
option go_package = "github.com/v3-tecnologia/protocol-cloud/proto/gen/domain/v1/adas;v1";
option optimize_for = CODE_SIZE;

package domain.adas.v1;

enum Side {
  SIDE_UNSPECIFIED = 0;
  SIDE_LEFT = 1;
  SIDE_RIGHT = 2;
}