syntax = "proto3";

package domain.network.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/v3-tecnologia/protocol-cloud/proto/gen/domain/v1/network;v1";
option java_multiple_files = true;
option java_outer_classname = "NetworkProto";
option java_package = "br.com.v3.protocol.domain";
option optimize_for = CODE_SIZE;

enum DataPlanStatus {
  DATA_PLAN_STATUS_UNSPECIFIED = 0;

  DATA_PLAN_STATUS_ACTIVE = 1;

  DATA_PLAN_STATUS_BLOCKED = 2;
}

message DataUsage {
  // Usage during the period (in megabytes)
  optional double used_mb = 1;

  // Total accumulated usage in the current cycle (in megabytes)
  optional double total_used_mb = 2;

  // Percentage of the allowance already consumed (0–100)
  optional double usage_percentage = 3;
}

message DataPlan {
  // Name of the data plan (e.g., "default", "quectel", "custom", etc...)
  string plan_name = 4;

  DataPlanStatus status = 5;

  // Total data allowance in megabytes
  uint64 total_mb = 1;

  // Current cycle start date
  google.protobuf.Timestamp cycle_start = 2;

  // Franchise renewal date
  google.protobuf.Timestamp cycle_end = 3;
}
