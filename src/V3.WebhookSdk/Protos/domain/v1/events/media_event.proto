syntax = "proto3";

package domain.events.v1;

import "buf/validate/validate.proto";
import "domain/v1/files/file.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/v3-tecnologia/protocol-cloud/proto/gen/domain/v1/events;v1";
option java_multiple_files = true;
option java_outer_classname = "FileEventProto";
option java_package = "br.com.v3.protocol.domain.events";
option optimize_for = CODE_SIZE;

enum MediaBucketType {
  MEDIA_BUCKET_TYPE_UNSPECIFIED = 0;

  MEDIA_BUCKET_TYPE_FACES = 1;

  MEDIA_BUCKET_TYPE_IMAGES = 2;

  MEDIA_BUCKET_TYPE_VIDEOS = 3;

  MEDIA_BUCKET_TYPE_ASSETS = 4;

  MEDIA_BUCKET_TYPE_AUDIOS = 5;

  MEDIA_BUCKET_TYPE_UPLOADS = 6;
}

// Image file event
message ImageFileEvent {
  domain.file.v1.File file = 1 [(buf.validate.field).required = true];

  domain.file.v1.ImageType image_type = 2;

  MediaBucketType bucket_type = 3;
}

// Video file event
message VideoFileEvent {
  domain.file.v1.File file = 1 [(buf.validate.field).required = true];

  domain.file.v1.VideoCodec video_codec = 2;

  domain.file.v1.AudioCodec audio_codec = 3;

  MediaBucketType bucket_type = 4;
}

// Raw/generic file event
message RawFileEvent {
  domain.file.v1.File file = 1 [(buf.validate.field).required = true];

  MediaBucketType bucket_type = 2;
}

// File event supporting multiple domain types
message Media {
  string id = 1 [(buf.validate.field).string.min_len = 1];

  string event_name = 2 [(buf.validate.field).string.min_len = 1];

  oneof type {
    ImageFileEvent image = 3;
    VideoFileEvent video = 4;
    RawFileEvent raw = 5;
  }

  google.protobuf.Timestamp timestamp = 100 [(buf.validate.field).timestamp.lt_now = true];
}

// Media upload completion event
message MediaUploadedEvent {
  string event_id = 1 [(buf.validate.field).string.min_len = 1];

  string media_id = 2 [(buf.validate.field).string.min_len = 1];

  string media_path = 3 [(buf.validate.field).string.min_len = 1];

  string filename = 4 [(buf.validate.field).string.min_len = 1];

  string mime_type = 5;

  int64 file_size = 6 [(buf.validate.field).int64.gte = 0];

  // File content with complete bytes - optional, if not provided use media_path to fetch from storage
  domain.file.v1.FileBytes file = 7;

  google.protobuf.Timestamp timestamp = 100 [(buf.validate.field).timestamp.lt_now = true];
}
