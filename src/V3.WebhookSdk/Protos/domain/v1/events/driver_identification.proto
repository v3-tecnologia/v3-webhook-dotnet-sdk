syntax = "proto3";

package domain.events.v1;

import "buf/validate/validate.proto";
import "domain/v1/driver/driver.proto";
import "domain/v1/location/location.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/v3-tecnologia/protocol-cloud/proto/gen/domain/v1/events;v1";
option java_multiple_files = true;
option java_outer_classname = "DriverIdentificationEventProto";
option java_package = "br.com.v3.protocol.domain.events";
option optimize_for = CODE_SIZE;

// Represents the outcome of a driver identification attempt.
//
// This event is emitted whenever a driver identification workflow
// completes, regardless of whether a driver was successfully identified.
//
// Consumers should inspect the `event` oneof to determine whether the
// identification was successful or not.
message DriverIdentification {
  // Unique identifier of this event instance.
  string id = 1 [(buf.validate.field).string.min_len = 1];

  // Unique identifier of this event instance.
  string event_name = 2;

  // Technology used to perform the identification process
  // (e.g. facial recognition, RFID, NFC, biometric reader).
  domain.driver.v1.IdentificationTechnology technology = 3;

  // Result of the identification attempt.
  oneof event {
    // Driver was successfully identified.
    DriverIdentifiedEvent identified = 4;

    // Driver could not be identified or timeout or an error occurred during the identification process.
    DriverUnidentifiedEvent unidentified = 5;
  }

  // Additional event-level metadata.
  //
  // Can be used to attach integration-specific information,
  // processing details, correlation identifiers, or vendor-specific data.
  map<string, string> metadata = 6;

  // Timestamp when the identification result was produced.
  google.protobuf.Timestamp timestamp = 100 [(buf.validate.field).timestamp.lt_now = true];
}

// Emitted when a driver has been successfully identified.
message DriverIdentifiedEvent {
  // Identifier of the credential that originated the match.
  //
  // Examples:
  // - RFID tag identifier
  // - NFC credential identifier
  // - QR code content
  string credential_identifier = 1 [(buf.validate.field).string.min_len = 1];

  // Detailed matching information, including the identified driver
  // and confidence or scoring information when available.
  domain.driver.v1.DriverMatch match = 2;

  // Additional metadata generated by the identification provider.
  //
  // Examples:
  // - Reader device serial number or model
  // - Hardware model information
  // - Raw matching scores
  // - Vendor-specific attributes
  //
  // Primarily intended for auditing, diagnostics, and troubleshooting.
  map<string, string> metadata = 3;

  // Physical location where the identification occurred.
  domain.location.v1.Location location = 4;
}

// Emitted when the system fails to identify a driver.
message DriverUnidentifiedEvent {
  // Reason that prevented the driver from being identified.
  DriverUnidentifiedCause cause = 1;

  // Physical location where the identification attempt occurred.
  domain.location.v1.Location location = 2;
}

// Describes the reason why a driver could not be identified.
//
// This message is extensible and allows new failure causes to be added
// without breaking compatibility.
message DriverUnidentifiedCause {
  oneof cause {
    DriverIdentificationTimeoutCause timeout = 1;
  }
}

// Indicates that the identification attempt exceeded the allowed time.
message DriverIdentificationTimeoutCause {
  // Component responsible for triggering the timeout.
  //
  // Examples:
  // - Camera subsystem
  // - Face recognition engine
  // - External identification service
  domain.driver.v1.TimeoutSource timeout_source = 1;

  // Additional timeout-related diagnostic information.
  //
  // Examples:
  // - Processing duration
  // - Retry count
  // - Hardware status
  // - Vendor-specific error details
  map<string, string> metadata = 2;
}
