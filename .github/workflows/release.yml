name: Publish NuGet Package

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore src/V3.WebhookSdk/V3.WebhookSdk.csproj

      - name: Build
        run: dotnet build src/V3.WebhookSdk/V3.WebhookSdk.csproj -c Release --no-restore

      - name: Pack
        run: dotnet pack src/V3.WebhookSdk/V3.WebhookSdk.csproj -c Release --no-build

      - name: Publish to NuGet
        run: |
          dotnet nuget push src/V3.WebhookSdk/bin/Release/*.nupkg \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
